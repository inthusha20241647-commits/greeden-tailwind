<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenDen</title>
    <link href="./src/output.css" rel="stylesheet">
    
</head>
<body>
    <!-- responsive navbar -->
    <nav class="bg-green-100 p-3 flex items-center justify-between shadow-xl  z-10 sticky top-0">
        <h1 class="text-3xl ">Greenden</h1>

        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6  md:hidden">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>

        <ul class="flex gap-5 text-gray-600 hidden md:flex">
            <li>
                <a  class="hover:underline hover:text-black" href="./index.html">Home</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black" href="./product.html">Product</a>
            </li>
            <li>
                <a class="hover:underline hover:text-black"href="./contact.html">Contact</a>
            </li>
        </ul>
    </nav>
    <section class="px-4 md:px-8 mt-6">
   <div class="max-w-xl mx-auto">
      <div class="mb-12">
         <h2 class="text-3xl text-center font-bold text-slate-900 mb-6 md:text-4xl">
            Contact us
         </h2>
         <p class="text-center text-base leading-relaxed text-slate-600">
            Have a question, need support, or want to discuss your next project? We’re here to help.
         </p>
      </div>

      <form class="space-y-6">
         <div>
            <label for="name"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Name</label>
            <input type="text" id="name" name="name" placeholder="John doe"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="email"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Email</label>
            <input type="email" id="email" name="email" placeholder="john@readymadeui.com"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="phone" class="mb-2 text-slate-900 font-medium text-sm inline-block">Phone
               number</label>
            <input type="number" id="phone" name="phone" placeholder="+11800-259-854"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="company"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Company</label>
            <input type="text" id="company" name="company" placeholder="XYZ pvt. ltd."
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600" />
         </div>
         <div>
            <label for="message"
               class="mb-2 text-slate-900 font-medium text-sm inline-block">Message</label>
            <textarea placeholder="Write message" rows="6" type="text" id="message" name="message"
               class="px-3 py-2.5 text-sm text-slate-900 w-full rounded-md bg-white outline-1 -outline-offset-1 outline-slate-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600"></textarea>
         </div>

         <button type="submit"
            class="py-2.5 px-4 text-sm rounded-md font-semibold cursor-pointer text-black border border-green-500 bg-green-100 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">Send
            message</button>
      </form>
   </div>
</section>
  
        
           
   


     <section class="bg-green-100 mt-5 p-5">
        <h1 class="text-3xl font-bold ">Greeden</h1>
        <p class="mt-2">The standard chunk of Loren ipsu used since the 1500 is reproduced below for those interest</p>
        <p class="mt-2">@ 2021 Greedy.com</p>
     </section>
</body>
</html>
